quarkus.datasource.db-kind=postgresql
quarkus.devservices.enabled=false
quarkus.compose.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:55432/ai_learning}
quarkus.datasource.username=${DB_USER:ai_learning}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true

%test.quarkus.datasource.jdbc=false
%test.quarkus.datasource.password=unused
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.flyway.enabled=false
%test.quarkus.flyway.migrate-at-start=false
