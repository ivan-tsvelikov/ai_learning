name: ai-learning
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_learning
      POSTGRES_USER: ${DB_USER:-ai_learning}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the local environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ai_learning"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
